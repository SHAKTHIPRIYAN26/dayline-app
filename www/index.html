<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B8A7A">
<title>Dayline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a left rail on wide screens that becomes a bottom tab bar on phones; the day is the unit, a progress ring is the hero. */
:root{
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#EDF1F3;--surface:#FFFFFF;--surface2:#E4EBEE;--ink:#0F1C24;--muted:#566873;--line:#D3DDE2;
  --accent:#0B8A7A;--accent-ink:#FFFFFF;--accent-soft:#D2EEE9;--warm:#B86E00;--warm-soft:#FBEACB;--danger:#C2412D;--danger-soft:#FADDD7;
  --bar:#9ED3CA;--on-hc:#FFFFFF;
  --l0:#DEE7EA;--l1:#BFE3DD;--l2:#86CDC2;--l3:#3FAE9C;--l4:#0B8A7A;
  --c1:#0B8A7A;--c2:#C27800;--c3:#D9573F;--c4:#2F6FD6;--c5:#7A5AC8;--c6:#C93D7E;
  --shadow:0 1px 2px rgba(15,28,36,.06),0 8px 24px -12px rgba(15,28,36,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1217;--surface:#121C23;--surface2:#1A2730;--ink:#E8F0F3;--muted:#92A5B0;--line:#243540;
  --accent:#3CCFB8;--accent-ink:#04201B;--accent-soft:#12372F;--warm:#F2B035;--warm-soft:#3A2C0E;--danger:#F28A77;--danger-soft:#43211B;
  --bar:#1F6B5F;--on-hc:#06141A;
  --l0:#1B2931;--l1:#17463F;--l2:#1F6F63;--l3:#2FA896;--l4:#3CCFB8;
  --c1:#3CCFB8;--c2:#F2B035;--c3:#F27F68;--c4:#6FA2F5;--c5:#A98BF0;--c6:#F07AAE;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1217;--surface:#121C23;--surface2:#1A2730;--ink:#E8F0F3;--muted:#92A5B0;--line:#243540;
  --accent:#3CCFB8;--accent-ink:#04201B;--accent-soft:#12372F;--warm:#F2B035;--warm-soft:#3A2C0E;--danger:#F28A77;--danger-soft:#43211B;
  --bar:#1F6B5F;--on-hc:#06141A;
  --l0:#1B2931;--l1:#17463F;--l2:#1F6F63;--l3:#2FA896;--l4:#3CCFB8;
  --c1:#3CCFB8;--c2:#F2B035;--c3:#F27F68;--c4:#6FA2F5;--c5:#A98BF0;--c6:#F07AAE;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.c1{--hc:var(--c1)}.c2{--hc:var(--c2)}.c3{--hc:var(--c3)}.c4{--hc:var(--c4)}.c5{--hc:var(--c5)}.c6{--hc:var(--c6)}

.shell{display:grid;grid-template-columns:minmax(0,1fr);max-width:1080px;margin:0 auto;min-height:100vh}
.rail{display:none}
main{min-width:0;padding-block:18px 112px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:2.4;stroke-linecap:round}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip[data-s="synced"] i{background:var(--accent)}
.chip[data-s="saving"] i{background:var(--warm)}
.chip[data-s="error"] i{background:var(--danger)}

.bar-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:0;background:none;border-radius:14px;color:var(--muted);font-size:12px;font-weight:500;min-height:52px}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:var(--accent);background:var(--accent-soft)}

.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,44px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.lede{color:var(--muted);margin-top:6px}
.head{margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px}
.sect h2{font-family:var(--f-display);font-weight:650;font-size:18px;letter-spacing:-.01em}
.sect span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;display:block}
.ring circle{fill:none;stroke-width:11;transform:rotate(-90deg);transform-origin:50% 50%}
.rt{stroke:var(--surface2)}
.rp{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.rc span{font-size:12px;color:var(--muted);margin-top:4px}
.hero .say{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.2;text-wrap:balance}
.hero .sub{color:var(--muted);margin-top:6px}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border:1px solid transparent;border-radius:16px;background:none}
.wd.on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.wl{font-size:11.5px;color:var(--muted);font-weight:500}
.wd.on .wl{color:var(--ink)}
.wc{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p),var(--line) 0)}
.wc i{font-style:normal;font-family:var(--f-mono);font-size:13px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg)}
.wd.on .wc i{background:var(--surface)}

.row{display:flex;align-items:center;gap:14px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-width:0}
.rbody{flex:1;min-width:0}
.rname{font-weight:600;overflow-wrap:anywhere}
.rmeta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-top:2px;flex-wrap:wrap}
.rmeta svg{width:14px;height:14px;fill:var(--warm)}
.rmeta .mono{font-family:var(--f-mono)}
.check{flex:none;width:48px;height:48px;border-radius:15px;border:2px solid var(--hc);background:transparent;color:transparent;display:grid;place-items:center;transition:background .18s,color .18s,transform .18s}
.check svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.habit.done .check{background:var(--hc);color:var(--on-hc)}
.habit.done .rname{color:var(--muted)}
.check:active{transform:scale(.92)}
.pop .check{animation:pop .42s cubic-bezier(.3,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.tcheck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);background:none;color:transparent;display:grid;place-items:center;transition:background .18s,border-color .18s}
.tcheck svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.task.done .tcheck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task.done .rname{color:var(--muted);text-decoration:line-through}
.late{color:var(--danger)}
.pill{flex:none;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.high{background:var(--danger-soft);color:var(--danger)}
.pill.med{background:var(--warm-soft);color:var(--warm)}
.x{flex:none;width:36px;height:36px;border-radius:12px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.x:hover{background:var(--danger-soft);color:var(--danger)}

.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border-radius:16px;background:var(--accent-soft);margin-bottom:16px}
.banner p{flex:1 1 220px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13.5px}
.mini{border:1px solid var(--line);background:none;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sug{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:13.5px;min-height:40px;text-align:left}
.sug .sd{width:10px;height:10px;border-radius:50%;background:var(--hc);flex:none}
.sug em{font-style:normal;font-weight:500;color:var(--muted);font-size:12px}
.sug:hover{border-color:var(--hc)}
.seg{display:flex;gap:6px;padding:4px;background:var(--surface2);border-radius:14px;margin:16px 0 14px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px;font-weight:600;color:var(--muted);min-height:42px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pbar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .6s}
.pstat{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.pstat b{font-family:var(--f-display);font-size:26px;font-weight:700}
.pstat span{color:var(--muted);font-size:13.5px}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.wk.cur{border-color:var(--accent)}
.wh{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border:0;background:none;text-align:left;min-height:56px}
.wh .wn{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--muted);width:46px}
.wh .wt{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.wh .wm{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pitems{border-top:1px solid var(--line)}
.pi{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.pi:last-child{border-bottom:0}
.pi.today{background:var(--accent-soft)}
.pi .pt{flex:1;min-width:0;overflow-wrap:anywhere}
.pi .when{flex:none;width:78px;text-align:right;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.pi.done .pt{color:var(--muted);text-decoration:line-through}
.pi.done .tcheck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pi.miss .when{color:var(--danger)}
.nd{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.nd>summary{list-style:none;cursor:pointer;padding:14px;font-family:var(--f-display);font-weight:650;font-size:17px;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:52px}
.nd>summary::-webkit-details-marker{display:none}
.nd>summary span{font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--muted)}
.nd .nb2{border-top:1px solid var(--line);padding:6px 14px 14px}
.alg{padding:12px 0;border-bottom:1px solid var(--line)}
.alg:last-child{border-bottom:0}
.alg>b{display:block;margin-bottom:4px}
.alg p{margin:3px 0;font-size:14px;color:var(--muted)}
.alg p i{font-style:normal;font-weight:600;color:var(--ink)}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font-family:var(--f-mono);font-size:11.5px;font-weight:500;color:var(--muted)}
.tw{overflow-x:auto}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:12.5px}
.plancard{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px}

.form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:16px;min-height:46px}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);background:var(--hc);box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.dows{display:flex;gap:6px;flex-wrap:wrap}
.dow{min-width:46px;padding:9px 0;border-radius:12px;border:1px solid var(--line);background:none;font-weight:600;font-size:13px;color:var(--muted)}
.dow.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.f{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13.5px;color:var(--muted)}
.f.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.hcard header{display:flex;align-items:center;gap:12px}
.hcard .dot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--hc)}
.hcard h3{font-family:var(--f-display);font-weight:650;font-size:18px;overflow-wrap:anywhere}
.grow{flex:1;min-width:0}
.meta{color:var(--muted);font-size:13px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.facts div{background:var(--bg);border-radius:14px;padding:10px 12px}
.facts b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.facts span{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i,.heat button{display:block;aspect-ratio:1;border-radius:4px;min-width:0;padding:0;border:0}
.heat .hd{background:var(--hc)}
.heat .hm{background:var(--l0)}
.heat .hn{background:var(--surface2);opacity:.4}
.heat .hx{visibility:hidden}
.heat.all{gap:4px}
.heat.all button{border-radius:5px}
.heat .l0{background:var(--l0)}.heat .l1{background:var(--l1)}.heat .l2{background:var(--l2)}.heat .l3{background:var(--l3)}.heat .l4{background:var(--l4)}
.heat button.sel{outline:2px solid var(--ink);outline-offset:1px}
.detail{margin-top:12px;font-size:14px;color:var(--muted);min-height:21px}
.detail b{color:var(--ink)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile b{display:block;font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.tile span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.chart{width:100%;height:auto;display:block}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.vl{fill:var(--ink);font-family:var(--f-mono);font-size:9.5px}
.bar{fill:var(--bar)}
.bar.hi{fill:var(--accent)}
.hb{display:flex;flex-direction:column;gap:14px}
.hb .top2{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.hb .top2 span:last-child{font-family:var(--f-mono);color:var(--muted)}
.track{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;border-radius:999px;background:var(--hc);transition:width .6s}
.note{font-size:14.5px;color:var(--ink);margin-top:12px}

@media (min-width:880px){
  .shell{grid-template-columns:230px minmax(0,1fr);gap:40px}
  .rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding-block:26px}
  .rail .brand{margin-bottom:22px}
  .rail .nb{flex:none;flex-direction:row;gap:12px;padding:12px 14px;font-size:15px;justify-content:flex-start;min-height:48px}
  .bar-nav{display:none}
  main{padding-block:30px 60px}
  .top .brand{display:none}
  .top{justify-content:flex-end}
  .hero{gap:28px;padding:22px}
  .ring{width:168px;height:168px}
  .rc b{font-size:38px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}
@media (max-width:420px){.hero{grid-template-columns:minmax(0,1fr)}.hero .ring{margin:0 auto}.hero .txt{text-align:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
</head>
<body>


<div class="shell">
  <aside class="rail" aria-label="Sections">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" opacity=".28"/><path d="M16 5a11 11 0 0 1 9.5 16.5"/><circle cx="16" cy="16" r="2.4" fill="currentColor" stroke="none" style="fill:var(--accent)"/></svg>Dayline</div>
    <div id="railnav" style="display:flex;flex-direction:column;gap:6px"></div>
  </aside>
  <main>

function bestStreak(h){var d=parse(h.created),end=parse(today()),t=today(),run=0,best=0;while(d<=end){var k=key(d);if(sched(h,k)){if(h.log[k]){run++;if(run>best)best=run}else if(k!==t)run=0}d=addDays(d,1)}return best}
function daysLabel(h){var s=h.days.slice().sort().join("");if(h.days.length===7)return"Every day";if(s==="12345")return"Weekdays";if(s==="06")return"Weekends";return ORDER.filter(function(x){return h.days.indexOf(x)>-1}).map(function(x){return WD[x]}).join(" · ")}

/* ---------- storage and sync ---------- */
function writeCache(){try{var p=payload();p.dirty=S.dirty;localStorage.setItem(CACHE,JSON.stringify(p))}catch(e){}}

function setStatus(s){var c=document.getElementById("chip"),t=document.getElementById("chiptxt");if(!c)return;c.setAttribute("data-s",s);
  t.textContent={synced:"Synced",saving:"Saving…",local:"This device only",error:"Sync paused"}[s]||""}
function persist(){writeCache();if(!ref){setStatus("local");return}setStatus("saving");clearTimeout(wTimer);wTimer=setTimeout(function(){wTimer=0;flush()},400)}
function flush(){if(!ref||writing)return;writing=true;var snap=payload();
  ref.set(JSON.parse(JSON.stringify(snap))).then(function(){writing=false;if(S.rev===snap.rev){S.dirty=false;writeCache();setStatus("synced")}else flush()})
  .catch(function(e){writing=false;if(e&&e.code==="invalid_argument"){ref=null;setStatus("local")}else setStatus("error")})}
function onRemote(snap){
  if(snap.metadata&&snap.metadata.hasPendingWrites)return;
  if(!snap.exists){if(S.dirty||(S.rev&&!S.sample))flush();else setStatus("synced");return}
  var d=snap.data()||{};if(wTimer||writing)return;
  if(S.dirty&&(d.rev||0)<S.rev){flush();return}
  if((d.rev||0)===S.rev){setStatus("synced");return}
  d.dirty=false;apply(d);render();if(S.dirty)persist();else{writeCache();setStatus("synced")}}
function connect(){
  if(!(window.claude&&window.claude.use))return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return null;return user.id().then(function(id){return id?{db:db,id:id}:null})
  }).then(function(c){if(!c)return;ref=c.db.doc("data/users/"+c.id+"/dayline");setStatus("saving");
    ref.onSnapshot(onRemote,function(){ref=null;setStatus("local")})
  }).catch(function(){ref=null;setStatus("local")})}

  if(a==="ttoggle"){var x=find(S.todos,id);if(!x)return;x.done=!x.done;x.doneAt=x.done?today():"";S.pop=id;return change()}
  if(a==="tdel"){S.todos=S.todos.filter(function(q){return q.id!==id});return change()}
  if(a==="filter"){S.filter=v;return render()}
  if(a==="clearDone"){S.todos=S.todos.filter(function(q){return !q.done});return change()}
  if(a==="fresh"){S.habits=S.habits.filter(function(q){return !/^s\d$/.test(q.id)});S.todos=S.todos.filter(function(q){return !/^t\d$/.test(q.id)});S.sample=false;S.form=null;return change()}
  if(a==="keep"){S.sample=false;return change()}
  if(a==="cell"){S.sel=k;return render()}
  if(a==="gohabit"){S.tab="habits";S.form={id:null,name:"",color:nextColor(),days:[0,1,2,3,4,5,6]};S.skip["hf-name"]=1;render();try{location.hash="habits";window.scrollTo(0,0)}catch(e){}return}
  if(a==="sug"){var sg=SUG[+v];if(!sg)return;S.habits.push({id:uid(),name:sg[0],color:sg[1],days:sg[2].slice(),created:today(),log:{}});return change()}
  if(a==="hnew"){S.form={id:null,name:"",color:nextColor(),days:[0,1,2,3,4,5,6]};S.skip["hf-name"]=1;render();var n=document.getElementById("hf-name");if(n)n.focus();return}
  if(a==="hedit"){var hh=find(S.habits,id);if(!hh)return;S.form={id:id,name:hh.name,color:hh.color,days:hh.days.slice()};S.confirm=null;S.skip["hf-name"]=1;render();try{window.scrollTo(0,0)}catch(e){}return}
  if(a==="hcancel"){S.form=null;S.confirm=null;S.skip["hf-name"]=1;return render()}
  if(a==="color"){syncForm();S.form.color=+v;return render()}
  if(a==="dow"){syncForm();var di=S.form.days.indexOf(+v);if(di>-1){if(S.form.days.length>1)S.form.days.splice(di,1)}else S.form.days.push(+v);return render()}
  if(a==="hdel"){if(S.confirm===id){S.habits=S.habits.filter(function(q){return q.id!==id});S.form=null;S.confirm=null;S.skip["hf-name"]=1;return change()}
    syncForm();S.confirm=id;render();setTimeout(function(){if(S.confirm===id){S.confirm=null;render()}},3500)}
});
document.addEventListener("submit",function(e){e.preventDefault();var id=e.target.id;
  if(id==="fh"){syncForm();var f=S.form;if(!f)return;var name=(f.name||"").trim();if(!name||!f.days.length)return;
    if(f.id){var h=find(S.habits,f.id);if(h){h.name=name;h.color=f.color;h.days=f.days.slice()}}
    else S.habits.push({id:uid(),name:name,color:f.color,days:f.days.slice(),created:today(),log:{}});
    S.form=null;S.confirm=null;S.skip["hf-name"]=1;return change()}
  if(id==="ft"||id==="qt"){var ti=document.getElementById(id==="ft"?"ft-text":"qt-text"),text=ti.value.trim();if(!text)return;
    var due=id==="ft"?document.getElementById("ft-due").value:S.day,pri=id==="ft"?document.getElementById("ft-pri").value:"med";
    ti.value="";S.todos.push({id:uid(),text:text,due:due||"",pri:pri,done:false,doneAt:""});
    if(id==="ft"){document.getElementById("ft-due").value=""}return change()}
});
window.addEventListener("hashchange",function(){if(route())render()});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&today()!==S.lastToday){S.lastToday=today();S.day=today();render()}});

/* ---------- start ---------- */
(function init(){
  var c=readCache();apply(c||sampleState());if(S.dirty)writeCache();
  route();render();setStatus("local");connect();
})();
})();
</script>
